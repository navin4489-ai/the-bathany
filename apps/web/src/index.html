  <!-- Inlined so the splash paints on the very first frame, before styles.css or main.js arrive. -->
  <style>
    #app-splash {
      position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: #faf6ef; font-family: "Jost", "Poppins", sans-serif;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #app-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-mark { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
    .splash-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid rgba(201, 162, 39, .22); border-top-color: #c9a227;
      animation: splash-spin 1.1s linear infinite;
    }
    .splash-ring.delayed {
      inset: 13px; border-width: 2px; border-top-color: transparent; border-left-color: #a07d16;
      animation-duration: 1.7s; animation-direction: reverse;
    }
    .splash-logo {
      width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
      animation: splash-pulse 1.9s ease-in-out infinite;
    }
    .splash-name {
      font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; color: #2b2620;
      animation: splash-rise .7s ease both;
    }
    .splash-tagline {
      margin-top: -12px; font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase;
      color: #a07d16; animation: splash-rise .7s .12s ease both;
    }
    .splash-dots { display: flex; gap: 7px; }
    .splash-dots span {
      width: 8px; height: 8px; border-radius: 50%; background: #c9a227;
      animation: splash-bounce 1.2s ease-in-out infinite;
    }
    .splash-dots span:nth-child(2) { animation-delay: .16s; }
    .splash-dots span:nth-child(3) { animation-delay: .32s; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @keyframes splash-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes splash-bounce { 0%, 100% { transform: translateY(0); opacity: .45; } 50% { transform: translateY(-7px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .splash-ring, .splash-logo, .splash-name, .splash-tagline, .splash-dots span { animation: none; }
    }
  </style>

  <div id="app-splash" role="status" aria-live="polite" aria-label="The Bathany is loading">
    <div class="splash-mark">
      <div class="splash-ring"></div>
      <div class="splash-ring delayed"></div>
      <img class="splash-logo" src="assets/brand/logo.jpeg" alt="">
    </div>
    <div class="splash-name">The Bathany</div>
    <div class="splash-tagline">Botanical Bath Rituals</div>
    <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <app-root></app-root>  <noscript>Please enable JavaScript to continue using this application.</noscript>
  <script>
    /*
     * Records when the splash first actually painted on screen.
     *
     * On an installed PWA the OS shows its own icon launch screen and only reveals the page
     * afterwards, so `performance.now()` (measured from navigation start) can already be well
     * past the minimum hold by the time the user sees anything. Anchoring to the first frame
     * rendered while the document is visible guarantees the loader is on screen for a real,
     * perceivable duration in both the browser and the installed app.
     */
    (function () {
      function mark() {
        if (window.__splashShownAt) return;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { window.__splashShownAt = performance.now(); });
        });
      }
      if (document.visibilityState === 'visible') mark();
      else document.addEventListener('visibilitychange', function once() {
        if (document.visibilityState !== 'visible') return;
        document.removeEventListener('visibilitychange', once);
        mark();
      });
    })();
  </script>
